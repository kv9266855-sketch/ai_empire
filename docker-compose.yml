services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: empire
      POSTGRES_USER: empire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empire -d empire"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://empire:${POSTGRES_PASSWORD}@postgres:5432/empire
      UPLOADS_DIR: /site/backend/uploads
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/site/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  uploads:
